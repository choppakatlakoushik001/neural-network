[project]
name = "neural-network-qec"
version = "0.1.0"
description = "Neural network decoders for quantum error correction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pandas>=3.0.5",
    "pymatching>=2.4.0",
    "sinter>=1.16.0",
    "stim>=1.16.0",
]

[project.optional-dependencies]
# Installed on demand: `uv sync --extra dev`
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_network_qec"]

# ---------------------------------------------------------------- tooling --
# The virtualenv deliberately lives OUTSIDE this folder. This repo sits in a
# OneDrive-synced directory on the Windows filesystem, where small-file writes
# measured ~50ms each -- a venv is thousands of files, and OneDrive would try
# to sync every one of them. Keeping it on the Linux side makes installs fast
# and keeps sync traffic to source files only.
[tool.basedpyright]
venvPath = "/home/chopp/.venvs"
venv = "neural-network-qec"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
